<head>

  <style>

.news-iframe-wrap {

    .schedule-image {

}

}

.image-modal {

.image-modal img {

}

.image-modal.show {

    .campaign-card {

    .campaign-placeholder {

    /* スマホ */
    @media (max-width: 600px) {

      }

      }

    /* 自動取得お知らせの文字サイズ調整 */
.news-list .news-item {
  display: block;
  position: relative;
  padding: 12px 28px 12px 8px;
  border-bottom: 1px solid #ddd;
  text-decoration: none;
  color: #333;
}

.news-list .news-date {
  display: inline-block;
  font-size: 13px;
  margin-right: 8px;
  color: #555;
}

.news-list .news-category {
  display: inline-block;

  margin-right: 8px;
  border-radius: 10px;

}

.news-list .news-text {
  display: block !important;
  margin-top: 6px;
  font-size: 15px;

  color: #333;

  /* タイトルを途中で切らない */
  white-space: normal !important;
  overflow: visible !important;

  -webkit-line-clamp: unset !important;
  -webkit-box-orient: unset !important;
  word-break: break-word;
}

.news-list .news-arrow {

  right: 8px;
  top: 50%;
  transform: translateY(-50%);

</head>

<body>

  <div class="page">

    <!-- ヘッダー -->
    <header class="header">
      <div class="header-small">たちかわ競輪</div>
      <div class="header-title">DOKOTOクラブ<br>スケジュール</div>
      <div class="header-sub">
        開催スケジュール・キャンペーン・お知らせ
      </div>
    </header>


  <!-- スケジュール -->
<section class="section schedule-section">

  <div class="section-title schedule-title">
    <span class="icon">📅</span>
    <span>開催スケジュール</span>
    <span class="month" id="scheduleMonth">読み込み中...</span>
  </div>

  <div class="schedule-image-wrap">

    <img
      id="scheduleImage"
      src=""
      alt="DOKOTOクラブ キャンペーンスケジュール"
      class="schedule-image"
      onclick="openScheduleImage()"
    >

  </div>

  <div id="scheduleDots"
       style="text-align:center; padding:0 0 8px;">
  </div>

  <div class="tap-message">
    🔍 スケジュール画像をタップすると拡大してご覧いただけます（再度タップすると元の画面に戻ります）<br>
  </div>

</section>

<script>

  function loadSchedules(data) {

    if (
      !data ||
      !data.success ||
      !data.schedules ||
      data.schedules.length === 0
    ) {
      return;
    }

    const schedules = data.schedules;

    const image = document.getElementById("scheduleImage");
    const month = document.getElementById("scheduleMonth");
    const dots = document.getElementById("scheduleDots");

    let currentIndex = 0;
    let startX = 0;
    let endX = 0;

    function showSchedule(index) {

      currentIndex = index;

      image.src = schedules[currentIndex].imageUrl;

      const targetMonth = schedules[currentIndex].targetMonth;

      month.textContent =
        targetMonth.replace("/", "年") + "月";

      dots.innerHTML = "";

      if (schedules.length > 1) {

        schedules.forEach(function(item, index) {

          const dot = document.createElement("span");

          dot.textContent =
            index === currentIndex ? "●" : "○";

          dot.style.fontSize = "14px";
          dot.style.margin = "0 4px";
          dot.style.cursor = "pointer";

          dot.addEventListener("click", function() {
            showSchedule(index);
          });

          dots.appendChild(dot);
        });
      }

      // 拡大表示用画像も現在の画像に合わせる
      const modalImage =
        document.querySelector("#scheduleModal img");

      if (modalImage) {
        modalImage.src = schedules[currentIndex].imageUrl;
        modalImage.alt =
          targetMonth + " DOKOTOクラブ キャンペーンスケジュール";
      }
    }

    // 初期表示
    showSchedule(0);

    // 左右スワイプ
    image.addEventListener("touchstart", function(e) {
      startX = e.touches[0].clientX;
    }, { passive: true });

    image.addEventListener("touchend", function(e) {

      endX = e.changedTouches[0].clientX;

      const difference = endX - startX;

      if (difference < -50) {

        currentIndex++;

        if (currentIndex >= schedules.length) {
          currentIndex = 0;
        }

        showSchedule(currentIndex);
      }

      if (difference > 50) {

        currentIndex--;

        if (currentIndex < 0) {
          currentIndex = schedules.length - 1;
        }

        showSchedule(currentIndex);
      }

    }, { passive: true });
  }


  const scheduleScript = document.createElement("script");

  scheduleScript.src =
    "https://script.google.com/macros/s/AKfycby37uzZTlp5Os6xG_YosHm3NTG5Qx06EJEqgudnwT4j7IZT9WDNa46uwQdumfMKIYv3/exec?mode=schedules&callback=loadSchedules";

  document.body.appendChild(scheduleScript);

</script>

    </section>


  <!-- キャンペーン -->
<section class="section campaign-section">

  <div class="section-title campaign-title">
    <span class="icon">🎁</span>
    <span>開催中・開催予定のキャンペーン</span>
  </div>

  <div id="campaignList">
    <div class="campaign-card">
      <div style="text-align:center; padding:20px;">
        キャンペーンを読み込んでいます...
      </div>
    </div>
  </div>

</section>


    <!-- お知らせ -->
    <section class="section news-section">

      <div class="section-title news-title">
        <span class="icon">📢</span>
        <span>DOKOTOクラブからのお知らせ</span>
      </div>

      <div class="news-list" id="newsList">
  <div style="text-align:center; padding:20px;">
    お知らせを読み込んでいます...
  </div>
</div>


<script>
  function loadCampaigns(data) {

    const campaignList = document.getElementById("campaignList");

    if (!data || !data.success || !data.campaigns || data.campaigns.length === 0) {
      campaignList.innerHTML = "";
      return;
    }

    const campaigns = data.campaigns;

    // キャンペーンカード
    const card = document.createElement("div");
    card.className = "campaign-card";
    card.style.position = "relative";
    card.style.overflow = "hidden";

    // 画像
    const image = document.createElement("img");
    image.src = campaigns[0].imageUrl;
    image.alt = "キャンペーン";
    image.style.display = "block";
    image.style.width = "100%";
    image.style.height = "auto";
    image.style.borderRadius = "8px";
    image.style.transition = "opacity 0.2s ease";

    card.appendChild(image);

    // 2件以上ある場合だけ切り替え機能を追加
    if (campaigns.length > 1) {

      let currentIndex = 0;
      let startX = 0;
      let endX = 0;

      // ドット表示
      const dots = document.createElement("div");
      dots.style.textAlign = "center";
      dots.style.padding = "8px 0 2px";

      campaigns.forEach(function(item, index) {

        const dot = document.createElement("span");

        dot.textContent = index === 0 ? "●" : "○";
        dot.style.fontSize = "14px";
        dot.style.margin = "0 4px";
        dot.style.cursor = "pointer";

        dot.addEventListener("click", function() {
          currentIndex = index;
          image.src = campaigns[currentIndex].imageUrl;

          const allDots = dots.querySelectorAll("span");

          allDots.forEach(function(d, i) {
            d.textContent = i === currentIndex ? "●" : "○";
          });
        });

        dots.appendChild(dot);
      });

      // 左右スワイプ
      image.addEventListener("touchstart", function(e) {
        startX = e.touches[0].clientX;
      }, { passive: true });

      image.addEventListener("touchend", function(e) {

        endX = e.changedTouches[0].clientX;

        const difference = endX - startX;

        // 左へスワイプ
        if (difference < -50) {
          currentIndex++;

          if (currentIndex >= campaigns.length) {
            currentIndex = 0;
          }
        }

        // 右へスワイプ
        if (difference > 50) {
          currentIndex--;

          if (currentIndex < 0) {
            currentIndex = campaigns.length - 1;
          }
        }

        image.src = campaigns[currentIndex].imageUrl;

        const allDots = dots.querySelectorAll("span");

        allDots.forEach(function(d, i) {
          d.textContent = i === currentIndex ? "●" : "○";
        });

      }, { passive: true });

      card.appendChild(dots);
    }

    campaignList.innerHTML = "";
    campaignList.appendChild(card);
  }


  const campaignScript = document.createElement("script");

 campaignScript.src =
"https://script.google.com/macros/s/AKfycby37uzZTlp5Os6xG_YosHm3NTG5Qx06EJEqgudnwT4j7IZT9WDNa46uwQdumfMKIYv3/exec?mode=campaigns&callback=loadCampaigns";

  document.body.appendChild(campaignScript);
</script>

      
<script>

  function loadNews(data) {

    const newsList = document.getElementById("newsList");

    if (!data || !data.success || !data.news) {
      newsList.innerHTML =
        '<div style="padding:20px; text-align:center;">お知らせを取得できませんでした。</div>';
      return;
    }

    newsList.innerHTML = "";

    data.news.forEach(function(item) {

      const newsItem = document.createElement("a");

      newsItem.className = "news-item";
      newsItem.href = item.url;
      newsItem.target = "_blank";
      newsItem.rel = "noopener noreferrer";

      newsItem.innerHTML =
        '<span class="news-date">' +
          escapeHtml(item.date) +
        '</span>' +

        '<span class="news-category">' +
          escapeHtml(item.category) +
        '</span>' +

        '<span class="news-text">' +
          escapeHtml(item.title) +
        '</span>' +

        '<span class="news-arrow">›</span>';

      newsList.appendChild(newsItem);
    });
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text || "";
    return div.innerHTML;
  }

  const newsScript = document.createElement("script");

  newsScript.src =
    "https://script.google.com/macros/s/AKfycby37uzZTlp5Os6xG_YosHm3NTG5Qx06EJEqgudnwT4j7IZT9WDNa46uwQdumfMKIYv3/exec?callback=loadNews";

  document.body.appendChild(newsScript);
</script>

      <a href="#" class="all-news">
        すべてのお知らせを見る ＞
      </a>

    </section>


    <!-- フッター -->
    <footer class="footer">
      <div class="footer-logo">DOKOTOクラブ</div>
      <div class="footer-text">たちかわ競輪 DOKOTOクラブ</div>
    </footer>

  </div>

<div id="scheduleModal" class="image-modal" onclick="closeScheduleImage()">
  <img
    src="schedule-2026-09.png"
    alt="2026年9月 DOKOTOクラブ キャンペーンスケジュール"
  >
</div>

 <script>
  function openScheduleImage() {
    document.getElementById("scheduleModal").classList.add("show");
  }

  function closeScheduleImage() {
    document.getElementById("scheduleModal").classList.remove("show");
  }
</script> 
 
</body>
